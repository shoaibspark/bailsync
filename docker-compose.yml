services:
  postgres:
    image: postgres:16-alpine
    container_name: bailsync-postgres
    environment:
      POSTGRES_USER: bailsync
      POSTGRES_PASSWORD: bailsync
      POSTGRES_DB: bailsync
    ports:
      - "5432:5432"
    volumes:
      - bailsync-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bailsync -d bailsync"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  bailsync-postgres-data:
